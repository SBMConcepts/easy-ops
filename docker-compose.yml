services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: easyops-dev
    ports:
      - '5173:5173'
      - '3000:3000'
    volumes:
      - ./src:/app/src
      - ./server:/app/server
      - ./public:/app/public
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./server
          target: /app/server
        - action: rebuild
          path: package.json

  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easyops-prod
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  node_modules:
