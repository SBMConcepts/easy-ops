services:
  dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: easyops-dev
    ports:
      - '5173:5173'
      - '3000:3000'
    volumes:
      - ./src:/app/src
      - ./server:/app/server
      - ./public:/app/public
      - node_modules:/app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:3000
      # Bind mounts on Windows/macOS don't emit file events
      - CHOKIDAR_USEPOLLING=true
    develop:
      watch:
        - action: rebuild
          path: package.json

  prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easyops-prod
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  node_modules:
